[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbrief"
version = "0.1.0"
description = "Local OpenMinion 0.1 + Ollama release and issue-triage agent that drafts structured patch briefs with approval-gated file writes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "openminion==0.1.22",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
patchbrief = "patchbrief.cli:main"

[tool.setuptools.packages.find]
include = ["patchbrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
